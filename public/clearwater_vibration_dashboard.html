<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearwater | Vibration Heatmap Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c10;--bg2:#0d1117;--bg3:#111720;--panel:#0e1520;--panel2:#141e2e;--border:#1e2d42;--border2:#243348;--cyan:#00d4ff;--cyan2:#0099cc;--green2:#00cc6a;--amber:#ffaa00;--red:#ff3355;--purple:#aa55ff;--text:#c8d8e8;--text2:#7a9ab8;--text3:#4a6a88;--font-head:'Orbitron',monospace;--font-body:'Rajdhani',sans-serif;--font-mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
.ld-title{font-family:var(--font-head);font-size:13px;color:var(--cyan);letter-spacing:4px;text-transform:uppercase;}
.ld-bar{width:200px;height:2px;background:var(--border);border-radius:1px;overflow:hidden;}
.ld-inner{height:100%;width:40%;background:var(--cyan);animation:slide 1.2s ease-in-out infinite;box-shadow:0 0 8px var(--cyan);}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(500%)}}
#header{position:sticky;top:0;z-index:100;background:rgba(8,12,16,0.97);border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;gap:20px;backdrop-filter:blur(12px);}
.hdr-logo{font-family:var(--font-head);font-size:12px;font-weight:700;color:var(--cyan);letter-spacing:2px;white-space:nowrap;}
.hdr-logo span{color:var(--text3);font-weight:400;}
.hdr-div{width:1px;height:28px;background:var(--border2);flex-shrink:0;}
.hdr-lbl{font-family:var(--font-head);font-size:9px;color:var(--text3);letter-spacing:3px;text-transform:uppercase;white-space:nowrap;}
.hdr-stats{margin-left:auto;display:flex;gap:20px;align-items:center;}
.stat-c{display:flex;flex-direction:column;align-items:flex-end;}
.stat-c .sv{font-family:var(--font-head);font-size:15px;font-weight:700;}
.stat-c .sl{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.s-alarm .sv{color:var(--red)}.s-alert .sv{color:var(--amber)}.s-ld .sv{color:var(--purple)}.s-total .sv{color:var(--cyan)}
.leg{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--text3);}
.leg-i{display:flex;align-items:center;gap:4px;}
.leg-dot{width:10px;height:10px;border-radius:2px;}
#app{display:flex;height:calc(100vh - 60px);position:relative;z-index:1;}
#sidebar{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-hd{padding:14px 16px 10px;font-family:var(--font-head);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.area-list{overflow-y:auto;flex:1;}
.area-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-bottom:1px solid rgba(30,45,66,0.4);transition:background 0.15s;position:relative;}
.area-item:hover{background:var(--panel2);}
.area-item.active{background:var(--panel2);}
.area-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.area-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.area-name{font-size:13px;font-weight:600;color:var(--text);flex:1;}
.area-item.active .area-name{color:var(--cyan);}
.area-badges{display:flex;gap:3px;}
.mb{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:2px;font-weight:500;}
.mb-1{background:rgba(255,51,85,0.2);color:var(--red);}
.mb-2{background:rgba(255,170,0,0.2);color:var(--amber);}
.mb-ld{background:rgba(170,85,255,0.2);color:var(--purple);}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border);}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap;}
#search-wrap{flex:1;min-width:180px;max-width:320px;position:relative;}
#search-wrap input{width:100%;background:var(--panel);border:1px solid var(--border2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:7px 12px 7px 34px;border-radius:4px;outline:none;transition:border-color 0.2s;}
#search-wrap input:focus{border-color:var(--cyan2);}
#search-wrap input::placeholder{color:var(--text3);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.filters{display:flex;gap:5px;flex-wrap:wrap;}
.fb{font-family:var(--font-body);font-size:12px;font-weight:600;padding:5px 11px;border-radius:3px;border:1px solid var(--border2);background:var(--panel);cursor:pointer;color:var(--text2);transition:all 0.15s;}
.fb:hover{color:var(--text);border-color:var(--text3);}
.fb.on{color:#fff;}
.fb[data-f="ALL"].on{border-color:var(--cyan);background:rgba(0,212,255,0.1);color:var(--cyan);}
.fb[data-f="1"].on{border-color:var(--red);background:rgba(255,51,85,0.1);color:var(--red);}
.fb[data-f="2"].on{border-color:var(--amber);background:rgba(255,170,0,0.1);color:var(--amber);}
.fb[data-f="3"].on{border-color:#ffee55;background:rgba(255,238,85,0.08);color:#ffee55;}
.fb[data-f="LD"].on{border-color:var(--purple);background:rgba(170,85,255,0.1);color:var(--purple);}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.wk-badge{font-family:var(--font-mono);font-size:11px;color:var(--text3);border:1px solid var(--border);padding:5px 10px;border-radius:3px;}
.wk-badge strong{color:var(--cyan);}
.btn-p{font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:1.5px;padding:7px 16px;border-radius:3px;border:1px solid var(--cyan);background:rgba(0,212,255,0.08);color:var(--cyan);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn-p:hover{background:rgba(0,212,255,0.18);box-shadow:0 0 12px rgba(0,212,255,0.25);}
.btn-g{font-family:var(--font-head);font-size:10px;font-weight:600;letter-spacing:1.5px;padding:7px 14px;border-radius:3px;border:1px solid var(--green2);background:rgba(0,255,136,0.06);color:var(--green2);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn-g:hover{background:rgba(0,255,136,0.14);}
#tbl-wrap{flex:1;overflow:auto;position:relative;}
table{border-collapse:collapse;min-width:100%;font-family:var(--font-body);}
thead{position:sticky;top:0;z-index:20;}
thead tr th{background:#090e16;border-bottom:2px solid var(--border2);font-family:var(--font-head);font-size:9px;font-weight:600;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;white-space:nowrap;}
th.tn{position:sticky;left:0;z-index:30;background:#090e16!important;min-width:250px;max-width:250px;padding:8px 16px;text-align:left;border-right:2px solid var(--border2);}
th.ti{position:sticky;left:250px;z-index:25;background:#090e16!important;min-width:110px;max-width:110px;padding:8px 10px;text-align:left;border-right:1px solid var(--border);}
th.td{min-width:50px;padding:8px 3px;text-align:center;border-right:1px solid rgba(30,45,66,0.3);}
th.td.cm{color:var(--cyan)!important;background:rgba(0,212,255,0.04)!important;}
tbody tr{border-bottom:1px solid rgba(20,30,46,0.7);transition:background 0.1s;}
tbody tr:hover{background:rgba(20,30,46,0.5);}
td.cn{position:sticky;left:0;z-index:10;background:var(--bg);min-width:250px;max-width:250px;padding:6px 16px;font-size:13px;font-weight:500;color:var(--text);border-right:2px solid var(--border2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
td.cn:hover{color:var(--cyan);}
td.ci{position:sticky;left:250px;z-index:10;background:var(--bg);min-width:110px;max-width:110px;padding:6px 10px;font-family:var(--font-mono);font-size:11px;color:var(--text3);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
tbody tr:hover td.cn,tbody tr:hover td.ci{background:rgba(10,15,22,0.99);}
td.cc{text-align:center;font-family:var(--font-mono);font-size:11px;min-width:50px;padding:2px 1px;border-right:1px solid rgba(20,32,50,0.4);}
td.cc.cm{background:rgba(0,212,255,0.03);}
.chip{display:inline-flex;align-items:center;justify-content:center;width:34px;height:24px;border-radius:3px;font-size:11px;font-weight:700;}
.c1{background:rgba(255,51,85,0.22);color:#ff6680;border:1px solid rgba(255,51,85,0.4);}
.c2{background:rgba(255,170,0,0.18);color:#ffcc44;border:1px solid rgba(255,170,0,0.35);}
.c3{background:rgba(255,238,85,0.1);color:#ccbb22;border:1px solid rgba(255,238,85,0.2);}
.cld{background:rgba(170,85,255,0.18);color:#cc88ff;border:1px solid rgba(170,85,255,0.38);}
.cer{color:rgba(74,106,136,0.5);font-size:9px;}
.cnt{color:rgba(74,106,136,0.35);font-size:9px;}
.con{color:var(--green2);font-size:9px;}
.ctx{color:var(--cyan2);font-size:9px;}
#pgn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.pgb{font-family:var(--font-mono);font-size:12px;padding:4px 10px;border:1px solid var(--border2);background:var(--panel);color:var(--text2);cursor:pointer;border-radius:3px;transition:all 0.15s;}
.pgb:hover:not(:disabled){border-color:var(--cyan2);color:var(--cyan);}
.pgb:disabled{opacity:0.3;cursor:default;}
.pg-info{font-family:var(--font-mono);font-size:11px;color:var(--text3);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:260px;color:var(--text3);font-family:var(--font-mono);font-size:13px;gap:8px;}
#mover{display:none;position:fixed;inset:0;background:rgba(5,8,14,0.88);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
#mover.show{display:flex;}
#modal{background:var(--panel);border:1px solid var(--border2);border-radius:6px;width:660px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.8);}
.mhd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border2);background:var(--panel2);}
.mhd h2{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--text);letter-spacing:1px;}
.msub{font-family:var(--font-mono);font-size:11px;color:var(--text3);margin-top:3px;}
.mcls{width:30px;height:30px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:15px;cursor:pointer;border-radius:3px;transition:all 0.15s;margin-left:auto;flex-shrink:0;}
.mcls:hover{border-color:var(--red);color:var(--red);}
.mbdy{padding:22px;overflow-y:auto;flex:1;}
.mft{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);}
.frm label{display:block;font-family:var(--font-head);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:14px;}
.frm label:first-child{margin-top:0;}
.frm input,.frm select,.frm textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:8px 12px;border-radius:4px;outline:none;transition:border-color 0.2s;}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--cyan2);}
.frm .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;margin-top:10px;}
.hcard{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px;text-align:center;}
.hd{font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-bottom:4px;}
.btn-c{font-family:var(--font-head);font-size:10px;font-weight:600;letter-spacing:1.5px;padding:7px 16px;border-radius:3px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;text-transform:uppercase;transition:all 0.15s;}
.btn-c:hover{border-color:var(--text2);color:var(--text);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* Clickable chips */
.chip-click{cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;}
.chip-click:hover{transform:scale(1.15);box-shadow:0 0 8px rgba(255,255,255,0.2);}
.chip-dot{font-size:7px;vertical-align:super;margin-left:1px;opacity:0.8;}
.hcard-diag{border-color:rgba(0,212,255,0.35)!important;background:rgba(0,212,255,0.05)!important;}
/* Diag Modal */
#diagModal{display:none;position:fixed;inset:0;background:rgba(5,8,14,0.88);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
#diagModal.show{display:flex;}
#diagBox{background:var(--panel);border:1px solid var(--border2);border-radius:6px;width:580px;max-width:95vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.8),0 0 30px rgba(0,212,255,0.05);}
.diag-hd{padding:16px 20px;border-bottom:1px solid var(--border2);background:var(--panel2);}
.diag-hd h3{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--text);letter-spacing:1px;margin-bottom:4px;}
.diag-hd .dsub{font-size:13px;color:var(--text2);}
.diag-body{padding:20px;overflow-y:auto;flex:1;}
.diag-body label{display:block;font-family:var(--font-head);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;margin-top:16px;}
.diag-body label:first-child{margin-top:0;}
.diag-body textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;border-radius:4px;outline:none;resize:vertical;transition:border-color 0.2s;line-height:1.5;}
.diag-body textarea:focus{border-color:var(--cyan2);}
.diag-saved-at{font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-top:10px;display:none;}
.diag-ft{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);}
.btn-del{font-family:var(--font-head);font-size:10px;font-weight:600;letter-spacing:1.5px;padding:7px 14px;border-radius:3px;border:1px solid rgba(255,51,85,0.4);background:rgba(255,51,85,0.06);color:rgba(255,51,85,0.7);cursor:pointer;text-transform:uppercase;transition:all 0.15s;margin-right:auto;}
.btn-del:hover{border-color:var(--red);color:var(--red);background:rgba(255,51,85,0.12);}
</style>
</head>
<body>
<div id="loading"><div class="ld-title">Loading Vibration Data</div><div class="ld-bar"><div class="ld-inner"></div></div></div>
<div id="header">
  <div class="hdr-logo">Clearwater<span> Paper</span></div>
  <div class="hdr-div"></div>
  <div class="hdr-lbl">Vibration Heatmap</div>
  <div class="hdr-stats">
    <div class="leg">
      <div class="leg-i"><div class="leg-dot" style="background:rgba(255,51,85,0.7)"></div>Alarm</div>
      <div class="leg-i"><div class="leg-dot" style="background:rgba(255,170,0,0.7)"></div>Alert</div>
      <div class="leg-i"><div class="leg-dot" style="background:rgba(255,238,85,0.5)"></div>Minor</div>
      <div class="leg-i"><div class="leg-dot" style="background:rgba(170,85,255,0.7)"></div>LD</div>
    </div>
    <div class="hdr-div"></div>
    <div class="stat-c s-alarm"><div class="sv" id="hAlarm">0</div><div class="sl">Alarm</div></div>
    <div class="stat-c s-alert"><div class="sv" id="hAlert">0</div><div class="sl">Alert</div></div>
    <div class="stat-c s-ld"><div class="sv" id="hLD">0</div><div class="sl">Lub Def</div></div>
    <div class="stat-c s-total"><div class="sv" id="hTotal">0</div><div class="sl">Assets</div></div>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div class="sb-hd">Mill Areas</div>
    <div class="area-list" id="areaList"></div>
    <div class="sb-foot"><button class="btn-p" style="width:100%" id="sbAddBtn">+ Add Entry</button></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <div id="search-wrap"><span class="si">&#9906;</span><input type="text" id="srch" placeholder="Search assets..."></div>
      <div class="filters">
        <button class="fb on" data-f="ALL">ALL</button>
        <button class="fb" data-f="1">&#128308; ALARM</button>
        <button class="fb" data-f="2">&#128993; ALERT</button>
        <button class="fb" data-f="3">&#9888; MINOR</button>
        <button class="fb" data-f="LD">&#128156; LUB DEF</button>
      </div>
      <div class="tb-right">
        <div class="wk-badge">Week <strong id="wkNum">-</strong></div>
        <button class="btn-g" id="expBtn">&#8595; Export CSV</button>
        <button class="btn-p" id="addBtn">+ Add Entry</button>
      </div>
    </div>
    <div id="tbl-wrap">
      <div class="empty" id="emptyState" style="display:none"><div style="font-size:28px;opacity:0.3">&#9672;</div><div>No assets match current filters</div></div>
      <table id="htbl"><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
    </div>
    <div id="pgn">
      <button class="pgb" id="pgPrev">&#8249; Prev</button>
      <span class="pg-info" id="pgInfo"></span>
      <button class="pgb" id="pgNext">Next &#8250;</button>
      <span style="margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text3)" id="pgCount"></span>
    </div>
  </div>
</div>
<div id="mover">
  <div id="modal">
    <div class="mhd"><div><h2 id="mTitle">ADD ENTRY</h2><div class="msub" id="mSub"></div></div><button class="mcls" id="mClose">&#10005;</button></div>
    <div class="mbdy"><div class="frm" id="mBody"></div></div>
    <div class="mft"><button class="btn-c" id="mCancel">Cancel</button><button class="btn-p" id="mSave">Save Entry</button></div>
  </div>
</div>
<script>


const ACOLORS=['#00aaff','#00ccff','#66aaff','#44ddaa','#ff8844','#ff5566','#aa88ff','#44cc88','#ffcc44'];
const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
let areas=[],activeIdx=0,filt='ALL',srch='',page=1;
const PG=50;
function parseDt(s){var p=s.split('-');if(p.length!==2)return 0;var m=MONTHS[p[0]];var y=parseInt(p[1])+(parseInt(p[1])<50?2000:1900);return(new Date(y,m,1)).getTime();}
function curMonth(){var n=new Date();return n.toLocaleString('en-US',{month:'short'})+'-'+String(n.getFullYear()).slice(-2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function chip(v,assetRef,date){
  if(v===undefined||v===null)return '';
  var s=String(v).trim().toUpperCase();
  var hasDiag=assetRef&&date&&assetRef.diag&&assetRef.diag[date];
  var note=hasDiag?'<span class="chip-dot">&#9679;</span>':'';
  var cls=assetRef?'chip-click':'';
  if(s==='1')return '<span class="chip c1 '+cls+'">1'+note+'</span>';
  if(s==='2')return '<span class="chip c2 '+cls+'">2'+note+'</span>';
  if(s==='3')return '<span class="chip c3 '+cls+'">3'+note+'</span>';
  if(s==='LD')return '<span class="chip cld '+cls+'">LD'+note+'</span>';
  if(s==='ER')return '<span class="chip cer '+cls+'">ER'+note+'</span>';
  if(s==='NT')return '<span class="chip cnt '+cls+'">NT'+note+'</span>';
  if(s==='ON')return '<span class="chip con '+cls+'">ON'+note+'</span>';
  if(s==='-')return '<span class="chip cnt '+cls+'">&#8212;'+note+'</span>';
  return '<span class="chip ctx '+cls+'" title="'+esc(String(v))+'">&#128221;'+note+'</span>';
}
function countV(assets,lv){var c=0;assets.forEach(function(a){Object.values(a.h).forEach(function(v){if(String(v).toUpperCase()===lv)c++;});});return c;}
function buildSidebar(){
  var el=document.getElementById('areaList');
  el.innerHTML=areas.map(function(a,i){
    var al=countV(a.assets,'1'),al2=countV(a.assets,'2'),ld=countV(a.assets,'LD');
    return '<div class="area-item'+(i===activeIdx?' active':'')+'" data-idx="'+i+'">'+
      '<div class="area-dot" style="background:'+a.color+';box-shadow:0 0 5px '+a.color+'44"></div>'+
      '<div class="area-name">'+esc(a.title)+'</div>'+
      '<div class="area-badges">'+
      (al>0?'<span class="mb mb-1">'+al+'</span>':'')+
      (al2>0?'<span class="mb mb-2">'+al2+'</span>':'')+
      (ld>0?'<span class="mb mb-ld">'+ld+'</span>':'')+
      '</div></div>';
  }).join('');
  el.querySelectorAll('.area-item').forEach(function(el2){
    el2.addEventListener('click',function(){activeIdx=parseInt(el2.dataset.idx);page=1;buildSidebar();renderTable();});
  });

function getFiltered(){
  var assets=(areas[activeIdx]&&areas[activeIdx].assets)||[];
  if(srch)assets=assets.filter(function(a){return a.n.toLowerCase().indexOf(srch)>=0||String(a.id).toLowerCase().indexOf(srch)>=0;});
  if(filt!=='ALL')assets=assets.filter(function(a){return Object.values(a.h).some(function(v){return String(v).toUpperCase()===filt;});});
  return assets;
}
function getDates(assets){
  var ds=new Set();
  assets.forEach(function(a){Object.keys(a.h).forEach(function(d){ds.add(d);});});
  return Array.from(ds).sort(function(a,b){return parseDt(a)-parseDt(b);});
}
function renderTable(){
  var filtered=getFiltered();
  var dates=getDates(filtered);
  var cm=curMonth();
  var totalPg=Math.max(1,Math.ceil(filtered.length/PG));
  if(page>totalPg)page=totalPg;
  var start=(page-1)*PG;
  var pg=filtered.slice(start,start+PG);
  var h='<tr><th class="tn">Equipment Name</th><th class="ti">Asset ID</th>';
  dates.forEach(function(d){h+='<th class="td'+(d===cm?' cm':'')+'">' +d+'</th>';});
  h+='</tr>';
  document.getElementById('tHead').innerHTML=h;
  var empty=document.getElementById('emptyState');
  var tbl=document.getElementById('htbl');
  if(pg.length===0){empty.style.display='flex';tbl.style.display='none';}
  else{empty.style.display='none';tbl.style.display='';}
  var rows=pg.map(function(a,ri){
    var cells=dates.map(function(d,di){return '<td class="cc'+(d===cm?' cm':'')+'" data-di="'+di+'">'+(a.h[d]!==undefined?chip(a.h[d],a,d):'')+'</td>';}).join('');
    return '<tr data-ri="'+(start+ri)+'"><td class="cn" title="'+esc(a.n)+'">'+esc(a.n)+'</td><td class="ci" title="'+esc(a.id)+'">'+esc(a.id)+'</td>'+cells+'</tr>';
  });
  document.getElementById('tBody').innerHTML=rows.join('');
  document.getElementById('tBody').querySelectorAll('tr').forEach(function(row){
    row.querySelector('td.cn').addEventListener('click',function(){
      var ri=parseInt(row.dataset.ri);
      openDetail(filtered[ri]);
    });
    row.querySelectorAll('td.cc').forEach(function(td){
      td.addEventListener('click',function(){
        var ri=parseInt(row.dataset.ri);
        var di=parseInt(td.dataset.di);
        if(filtered[ri]&&filtered[ri].h[dates[di]]!==undefined){
          openCellDiag(filtered[ri],dates[di]);
        }
      });
    });
  });
  document.getElementById('pgInfo').textContent='Page '+page+' of '+totalPg;
  document.getElementById('pgCount').textContent=filtered.length+' assets';
  document.getElementById('pgPrev').disabled=page<=1;
  document.getElementById('pgNext').disabled=page>=totalPg;
}
function updateStats(){
  var a1=0,a2=0,ld=0,tot=0;
  areas.forEach(function(a){
    tot+=a.assets.length;
    a.assets.forEach(function(x){Object.values(x.h).forEach(function(v){var s=String(v).toUpperCase();if(s==='1')a1++;else if(s==='2')a2++;else if(s==='LD')ld++;});});
  });
  document.getElementById('hAlarm').textContent=a1;
  document.getElementById('hAlert').textContent=a2;
  document.getElementById('hLD').textContent=ld;
  document.getElementById('hTotal').textContent=tot;
}
function updateWeek(){
  var d=new Date(),s=new Date(d.getFullYear(),0,1);
  document.getElementById('wkNum').textContent=Math.ceil(((d-s)/86400000+s.getDay()+1)/7);
}

function openCellDiag(asset,date){
  if(!asset||!date)return;
  var area=areas[activeIdx];
  var val=asset.h[date];
  if(!asset.diag)asset.diag={};
  var existing=asset.diag[date]||{rec:'',diag:''};
  var s=String(val).toUpperCase();
  var cols={1:'var(--red)',2:'var(--amber)','3':'#ffee55',LD:'var(--purple)',ER:'var(--text3)',NT:'var(--text3)',ON:'var(--green2)'};
  var col=cols[s]||'var(--cyan)';
  document.getElementById('diagTitle').textContent=asset.n;
  document.getElementById('diagSub').innerHTML=
    '<span style="color:var(--text3)">'+date+'</span> &nbsp;'+
    '<span style="background:rgba(255,255,255,0.06);border:1px solid '+col+';color:'+col+';font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:3px;font-weight:700">'+esc(String(val))+'</span>'+
    ' &nbsp;<span style="color:var(--text3)">'+area.title+'</span>';
  document.getElementById('diagRec').value=existing.rec||'';
  document.getElementById('diagDiag').value=existing.diag||'';
  if(existing.savedAt){
    document.getElementById('diagSavedAt').textContent='Last saved: '+existing.savedAt;
    document.getElementById('diagSavedAt').style.display='block';
  } else {
    document.getElementById('diagSavedAt').style.display='none';
  }
  document.getElementById('diagSaveBtn').onclick=function(){
    var rec=document.getElementById('diagRec').value.trim();
    var dg=document.getElementById('diagDiag').value.trim();
    asset.diag[date]={rec:rec,diag:dg,val:String(val),savedAt:new Date().toLocaleString()};
    renderTable();
    var btn=document.getElementById('diagSaveBtn');
    btn.textContent='Saved!';btn.style.borderColor='var(--green2)';btn.style.color='var(--green2)';
    document.getElementById('diagSavedAt').textContent='Last saved: '+asset.diag[date].savedAt;
    document.getElementById('diagSavedAt').style.display='block';
    setTimeout(function(){btn.textContent='Save';btn.style.borderColor='';btn.style.color='';},1500);
  };
  document.getElementById('diagDeleteBtn').onclick=function(){
    if(asset.diag)delete asset.diag[date];
    renderTable();
    document.getElementById('diagModal').classList.remove('show');
  };
  document.getElementById('diagCloseBtn').onclick=function(){document.getElementById('diagModal').classList.remove('show');};
  document.getElementById('diagModal').classList.add('show');
}

      <textarea id="diagRec" rows="3" placeholder="Recommended action: replace bearing, schedule shutdown, lubricate, monitor weekly, etc..."></textarea>
      <div class="diag-saved-at" id="diagSavedAt"></div>
    </div>
    <div class="diag-ft">
      <button class="btn-del" id="diagDeleteBtn">&#10006; Clear Notes</button>
      <button class="btn-c" id="diagCloseBtn">Cancel</button>
      <button class="btn-p" id="diagSaveBtn">Save</button>
    </div>
  </div>
</div>

</body>
</html>
